      if (!c.me) { const el = document.createElement('span'); el.className = 'medot'; el.setAttribute('role', 'img'); el.setAttribute('aria-label', 'You are here'); c.me = new c.ml.Marker({ element: el }); }
      c.me.setLngLat(ll).addTo(c.map);
      c.map.easeTo({ center: ll, zoom: Math.max(c.map.getZoom(), 16), duration: 500 });
    }
    const zoomBy = d => { const c = st.current; if (c.map) c.map.zoomTo(c.map.getZoom() + d, { duration: 200 }); };
    return html`<div class=${'rmap ' + (cls || '')} style=${cls ? null : 'aspect-ratio:1.1'}>
      <div class="lf" ref=${box} role="region" aria-label="Course map. Tap a bar for details and directions."></div>
      <div class="rmap-tools"><button class="mapbtn" onClick=${() => fit(true)}>Whole course</button>${mode === 'join' ? null : html`<button class="mapbtn" onClick=${findMe}>${I.pin}Where am I</button>`}</div>
      <div class="rmap-zoom"><button class="mapbtn" aria-label="Zoom in" onClick=${() => zoomBy(1)}>+</button><button class="mapbtn" aria-label="Zoom out" onClick=${() => zoomBy(-1)}>−</button></div>
      ${note ? html`<p class="rmap-note" role="status">${note}</p>` : null}
    </div>`;
  }
  function MapScreen() {
    useTick(30000);
    const p = S.me ? progress(S.me.id) : null;
    return html`<div class="page" style="padding-bottom:0">
      <${RouteMap} mode="runner" p=${p} cls="mapscreen" />
      <p class="tiny">Tap a bar for its address, leave time and directions.</p>
    </div>`;
  }

  /* Organizer: find a bar by name or address (OpenStreetMap search), paste coordinates, or stand there. */
  async function geocode(q) {
    const query = /philadelphia|phila\b|\bpa\b/i.test(q) ? q : q + ', Philadelphia, PA';
    const u = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&bounded=1&viewbox=-75.30,40.14,-74.95,39.86&q=' + encodeURIComponent(query);
    const r = await fetch(u, { headers: { 'Accept-Language': 'en' } });
    if (!r.ok) throw new Error('search');
    return (await r.json()).map(x => {
      const a = x.address || {}, street = [a.house_number, a.road].filter(Boolean).join(' ');
      return { name: x.name || street, addr: street || (x.display_name || '').split(',').slice(0, 2).join(','), label: x.display_name, lat: +(+x.lat).toFixed(5), lng: +(+x.lon).toFixed(5) };
    });
  }

  function Organizer({ back }) {
    useTick(5000);
    const [email, setEmail] = useState(''), [code, setCode] = useState(''), [sent, setSent] = useState(false), [err, setErr] = useState('');
    const [open, setOpen] = useState(null), [goUndo, setGoUndo] = useState(false);
    const [sel, setSel] = useState(1), [coord, setCoord] = useState(''), [cErr, setCErr] = useState('');
    const [q, setQ] = useState(''), [hits, setHits] = useState(null), [qBusy, setQBusy] = useState(false);
    if (S.mode === 'cloud' && !S.admin) {
      return html`<div class="page"><h1 class="h2">Organizer</h1>
        <p class="sub2">Organizers sign in with their email. We'll send a sign-in link.</p>
        ${!sent ? html`<div class="field"><label for="oe">Email</label><input id="oe" type="email" autocomplete="email" autocapitalize="off" autocorrect="off" spellcheck="false" value=${email} onInput=${e => setEmail(e.target.value)} /></div>
          <button class="btn solid full" onClick=${async () => { setErr(''); try { await S.api.sendCode(email.trim()); setSent(true); } catch (x) { setErr(x.message); } }}>Email me a sign-in link</button>`
        : html`<p><b>Check your email</b> and open the link on this phone. It brings you back here signed in. If the email shows a 6-digit code instead, type it below.</p>
          <div class="field"><label for="oc">6-digit code</label><input id="oc" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="6" value=${code} onInput=${e => setCode(e.target.value.replace(/\D/g, ''))} /></div>
          <button class="btn solid full" onClick=${async () => { setErr(''); try { await S.api.verifyCode(email.trim(), code); } catch (x) { setErr(x.message); } }}>Sign in</button>`}
        <p class="err" role="alert">${err}</p>
        <button class="btn full" onClick=${back}>Back to the race</button></div>`;
    }
    const n = lastOrd(), st = S.stops[Math.min(sel, n)], si = Math.min(sel, n);
    const structLocked = Object.keys(S.taps).length > 0;
    async function save(stops, msg) { try { await S.api.saveRoute(withKm(stops)); if (msg) say(msg); } catch (x) { say(x.message || "Couldn't save. Try again."); } }
    async function place(ll, extra) {
      const stops = copyStops(); stops[si].lat = +ll.lat.toFixed(5); stops[si].lng = +ll.lng.toFixed(5);
      if (extra && extra.addr) stops[si].addr = extra.addr.slice(0, 60);
      if (extra && extra.name && /^(bar \d+|new bar)$/i.test(stops[si].name)) { stops[si].name = extra.name.slice(0, 40); stops[si].short = extra.name.slice(0, 18); }
      await save(stops, 'Moved ' + stops[si].short + '.');
    }
    async function search(e) {
      e && e.preventDefault(); if (!q.trim()) return;
      setQBusy(true); setHits(null);
      try { setHits(await geocode(q.trim())); } catch (x) { setHits([]); say(S.mode === 'demo' ? 'Address search works on the live site.' : "Search didn't answer. Try again, or paste coordinates."); }
      setQBusy(false);
    }
    async function setHere() {
      const fix = await locate();
      if (fix.sim) { say('Preview: your location is simulated, so tap the map instead.'); return; }
      if (fix.error) { say("Couldn't get your location. Tap the map instead."); return; }
      await place({ lat: fix.lat, lng: fix.lng }); say(st.short + ' set to where you are (within ' + meters(fix.acc) + ').');
    }
    async function pasteCoord() {
      setCErr('');
      const m = coord.match(/(-?\d+\.\d+)\s*[, ]\s*(-?\d+\.\d+)/);
      if (!m) { setCErr('Paste coordinates like 39.95016, -75.16204.'); return; }
      const lat = +m[1], lng = +m[2];
      if (Math.abs(lat - 39.95) > 0.2 || Math.abs(lng + 75.16) > 0.3) { setCErr("Those coordinates aren't in Philadelphia."); return; }
      await place({ lat, lng }); setCoord('');
    }
    async function addAfter() {
      const stops = copyStops(), a = stops[si], b = stops[si + 1] || a;
      const nb = { name: 'New bar', short: 'New bar', addr: '', lat: +((a.lat + b.lat) / 2 + (b === a ? 0.002 : 0)).toFixed(5), lng: +((a.lng + b.lng) / 2).toFixed(5), radius: 150, leaveBy: (a.leaveBy || S.event.startMs) + 40 * 60000 };
      stops.splice(si + 1, 0, nb); setSel(si + 1); await save(stops, 'Added a bar after ' + a.short + '. Search for it to place it.');
    }
    async function remove() { const stops = copyStops(); stops.splice(si, 1); setSel(Math.max(1, si - 1)); await save(stops, 'Removed ' + st.short + '.'); }
    async function rename(v) { const stops = copyStops(); stops[si].name = v.slice(0, 40); stops[si].short = v.slice(0, 18); await save(stops); }
    async function setRadius(r) { const stops = copyStops(); stops[si].radius = r; await save(stops); }
    async function setLeave(i, v) { if (!v) return; const stops = copyStops(); stops[i].leaveBy = fromNY(nyDate(stops[i].leaveBy || S.event.startMs), v); await save(stops); }
    async function setStart(date, time) {
      const ms = fromNY(date, time), delta = ms - S.event.startMs;
      const stops = copyStops(); stops.forEach(x => { if (x.leaveBy) x.leaveBy += delta; });
      await S.api.saveEvent({ startMs: ms }); await save(stops, 'Start set to ' + clockAP(ms) + '. Leave-by times moved with it.');
    }
    async function doGo() { await S.api.setGo(now()); setGoUndo(true); say('GO. The start is open.'); setTimeout(() => setGoUndo(false), 60000); }
    const runners = Object.values(S.runners).sort((a, b) => a.bib - b.bib);
    // Arrival estimates for planning: runners at 8:00/mi, walkers at 20:00/mi, leaving at the previous leave-by time.
    function window_(i) {
      const prev = i === 1 ? S.event.startMs : S.stops[i - 1].leaveBy, s = S.stops[i];
      if (!prev) return null;
      const mi = s.km / MI, run = prev + mi * 8 * 60000, walk = prev + mi * 20 * 60000;
      return { run, walk, walkBar: s.leaveBy ? (s.leaveBy - walk) / 60000 : null, runBar: s.leaveBy ? (s.leaveBy - run) / 60000 : null };
    }
    return html`<div class="page">
      <div class="lbhead"><h1 class="h2">Organizer</h1><button class="btn small" onClick=${back}>Back to the race</button></div>

      <div class="card" style="display:flex;flex-direction:column;gap:12px">
        ${S.event.goMs == null
          ? html`<p><b>Not started.</b> Scheduled for ${clockAP(S.event.startMs)}.</p><button class="big" onClick=${doGo}><span class="l1">GO</span><span class="l2">Opens the start. Everyone starts their own clock</span></button>`
          : html`<p><b>Start opened at ${clockAP(S.event.goMs)}.</b> Runners start their own clock with the Start button, whenever they set off.</p>
            ${goUndo ? html`<button class="btn red full" onClick=${async () => { await S.api.setGo(null); setGoUndo(false); say('GO undone.'); }}>Undo GO</button>` : null}`}
      </div>

      <div class="card" style="display:flex;flex-direction:column;gap:12px">
        <h2 class="h2" style="font-size:22px">Course</h2>
        <div class="opts" role="group" aria-label="Pick a stop">${S.stops.map((x, i) => html`<button class="opt" aria-pressed=${i === si ? 'true' : 'false'} onClick=${() => { setSel(i); setHits(null); }}><span class="num">${i === 0 ? 'S' : i}</span> ${x.short}</button>`)}</div>
        <${RouteMap} mode="org" sel=${si} onSelect=${i => { setSel(i); setHits(null); }} />
        <div class="field"><label class="tiny" for="sn">Name</label><input id="sn" class="small-in" value=${st.name} onChange=${e => rename(e.target.value.trim() || st.name)} /></div>
        <form class="field" onSubmit=${search}><label class="tiny" for="gq">Find ${st.short} by name or address</label>
          <div class="row2" style="grid-template-columns:minmax(0,1fr) auto"><input id="gq" class="small-in" type="search" enterkeyhint="search" placeholder="e.g. McGillin's or 1310 Drury St" value=${q} onInput=${e => setQ(e.target.value)} /><button class="btn small" type="submit" aria-disabled=${qBusy ? 'true' : 'false'}>${qBusy ? 'Searching…' : 'Search'}</button></div>
          ${hits && hits.length ? html`<div class="geo-results">${hits.map(h => html`<button type="button" class="btn small full" onClick=${async () => { await place({ lat: h.lat, lng: h.lng }, h); setHits(null); setQ(''); }}><b>${h.name || h.addr}</b><span>${[h.name && h.addr !== h.name ? h.addr : '', h.label.split(', ').slice(-5, -3).join(', ')].filter(Boolean).join(' · ')}</span></button>`)}</div>` : null}
          ${hits && !hits.length ? html`<p class="tiny">Nothing found in Philadelphia. Try the street address.</p>` : null}</form>
        <div><p class="tiny" style="margin-bottom:6px">Check-in radius</p><div class="opts">${[75, 120, 150, 200].map(r => html`<button class="opt" aria-pressed=${st.radius === r ? 'true' : 'false'} onClick=${() => setRadius(r)}>${r} m</button>`)}</div></div>
        <div class="row2"><button class="btn small" onClick=${setHere}>${I.pin}Use my location</button><a class="btn small" href=${pinUrl(st)} target="_blank" rel="noopener">Check in ${APPLE ? 'Apple' : 'Google'}</a></div>
        <${LocationCheck} stop=${si} />
        <div class="field"><label class="tiny" for="pc">Or paste coordinates from Google or Apple Maps</label>
          <div class="row2" style="grid-template-columns:1fr auto"><input id="pc" class="small-in num" inputmode="decimal" placeholder="39.95016, -75.16204" value=${coord} onInput=${e => setCoord(e.target.value)} /><button class="btn small" onClick=${pasteCoord}>Place</button></div>
          ${cErr ? html`<p class="err" role="alert">${cErr}</p>` : null}</div>
        <p class="tiny num">${st.addr ? st.addr + ' · ' : ''}${st.lat.toFixed(5)}, ${st.lng.toFixed(5)}${si ? ' · leg ' + si + ' is about ' + km(st.km) + ' on foot' : ''}</p>
        ${structLocked ? html`<p class="tiny">Adding and removing bars is locked once anyone has checked in. Names, pins and times can still change.</p>`
          : html`<div class="row2">${si < n ? html`<button class="btn small" onClick=${addAfter}>Add a bar after this</button>` : html`<span></span>`}${si > 0 && n > 1 ? html`<button class="btn small red" onClick=${remove}>Remove this bar</button>` : html`<span></span>`}</div>`}
      </div>

      <div class="card" style="display:flex;flex-direction:column;gap:12px">
        <h2 class="h2" style="font-size:22px">Times</h2>
        <div class="grid2">
          <div class="field"><label class="tiny" for="rd">Race date</label><input id="rd" class="small-in num" type="date" value=${nyDate(S.event.startMs)} onChange=${e => e.target.value && setStart(e.target.value, nyTime(S.event.startMs))} /></div>
          <div class="field"><label class="tiny" for="rs">Start opens</label><input id="rs" class="small-in num" type="time" step="300" value=${nyTime(S.event.startMs)} onChange=${e => e.target.value && setStart(nyDate(S.event.startMs), e.target.value)} /></div>
        </div>
        <p class="tiny">Changing the start moves every leave-by time with it. Estimates assume runners at 8:00/mi and walkers at 20:00/mi.</p>
        ${S.stops.map((x, i) => {
          if (i === 0) return null;
          const wv = window_(i);
          const short = wv && wv.walkBar != null && wv.walkBar < 15;
          return html`<div class="orgstop">
            <div class="grid2" style="align-items:end">
              <p><b>${i}. ${x.short}</b><br /><span class="tiny num">${wv ? 'arrive ' + clock(wv.run) + '–' + clock(wv.walk) : ''}</span></p>
              ${i < n ? html`<div class="field"><label class="tiny" for=${'lv' + i}>Leave by</label><input id=${'lv' + i} class="small-in num" type="time" step="300" value=${x.leaveBy ? nyTime(x.leaveBy) : ''} onChange=${e => setLeave(i, e.target.value)} /></div>` : html`<p class="tiny">Finish · medals</p>`}
            </div>
            ${i < n && wv && wv.walkBar != null ? html`<p class=${'tiny num' + (short ? ' err' : '')}>${short ? 'Short: ' : ''}walkers get ${Math.round(wv.walkBar)} min at the bar, runners ${Math.round(wv.runBar)} min</p>` : null}
          </div>`;
        })}
      </div>

      <div class="card"><h2 class="h2" style="font-size:22px">Runners · ${runners.length}</h2>
        ${runners.map(r => {
          const ts = Object.values(S.taps).filter(t => t.runnerId === r.id).sort((a, b) => a.at - b.at);
          return html`<div class="orgstop">
            <button class="btn full" style="justify-content:space-between" aria-expanded=${open === r.id ? 'true' : 'false'} onClick=${() => setOpen(open === r.id ? null : r.id)}><span class="num">${r.bib} · ${r.name}${r.sample ? ' (sample)' : ''}${r.hidden ? ' (hidden)' : ''}</span><span class="tiny">${ts.length} taps ›</span></button>
            ${open === r.id ? html`<div>${ts.map(t => html`<div class="taprow num"><span>${t.kind === 'arrive' ? 'At' : 'Left'} ${S.stops[t.stop] ? S.stops[t.stop].short : 'stop ' + t.stop} · ${clock(t.at)}${t.kind === 'arrive' && !t.verified ? ' · not GPS' : ''}</span><button class="btn small red" onClick=${() => S.api.deleteTap(t.id).then(() => say('Tap removed.'))}>Remove tap</button></div>`)}
              <button class="btn small full" style="margin-top:10px" onClick=${() => S.api.unlockRunner(r.id).then(() => say('Bib ' + r.bib + ' can move to a new phone. Taps kept.'))}>Let bib ${r.bib} move to a new phone</button>
              <button class="btn small red full" style="margin-top:10px" onClick=${() => S.api.removeRunner(r.id).then(() => say('Bib ' + r.bib + ' released.'))}>Release bib ${r.bib} and delete its taps</button></div>` : null}
          </div>`;
        })}
      </div>

      <${ClearAll} />
    </div>`;
  }

  /* ---------------- Preview controls (demo only) ---------------- */
  /* After a practice run: wipe check-ins and the GO. Two taps, the second one names what it deletes. */
  function ClearAll() {
    const [arm, setArm] = useState(false);
    const n = Object.keys(S.taps).length;
    useEffect(() => { if (!arm) return; const t = setTimeout(() => setArm(false), 6000); return () => clearTimeout(t); }, [arm]);
    async function go() {
      if (!arm) { setArm(true); return; }
      setArm(false);
      try { await S.api.clearTaps(); say('Check-ins cleared. Bibs kept.'); } catch (e) { say("Couldn't clear. Check your signal and try again."); }
    }
    return html`<div class="card" style="display:flex;flex-direction:column;gap:10px"><h2 class="h2" style="font-size:22px">After a practice run</h2>
      <p class="tiny">Clears every check-in and the GO so race day starts clean. Runners keep their bibs.</p>
      <button class="btn red full" onClick=${go} disabled=${n === 0 && !S.event.goMs}>${arm ? 'Tap again to delete ' + n + ' check-ins' : n ? 'Clear all ' + n + ' check-ins' : 'Nothing to clear'}</button></div>`;
  }
  function PracticeBar() {
    const [busy, setBusy] = useState(false);
    async function end() {
      setBusy(true);
      try { await S.api.clearMine(); setPractice(false); say('Practice over. Your practice check-ins are gone.'); }
      catch (e) { say("Couldn't clear your practice check-ins. Check your signal and try again."); }
      setBusy(false);
    }
    return html`<div class="practice" role="status"><span><b>Practice run</b> · only on this phone</span><button class="btn small" onClick=${end} aria-disabled=${busy ? 'true' : 'false'}>${busy ? 'Clearing…' : 'End practice'}</button></div>`;
  }
  function Preview({ onOrg }) {
    const ref = useRef(null);
    const [openS, setOpenS] = useState(false);
    useEffect(() => { const d = ref.current; if (!d) return; if (openS && !d.open) d.showModal(); if (!openS && d.open) d.close(); }, [openS]);
    const scene = k => { demoScene(k); setOpenS(false); };
    const opt = (cur, val, label, fn) => html`<button class="opt" aria-pressed=${cur === val ? 'true' : 'false'} onClick=${fn}>${label}</button>`;
    return html`<button class="prev-btn" onClick=${() => setOpenS(true)}>${CFG ? 'Demo' : 'Preview'}</button>
      <dialog class="sheet" ref=${ref} onClose=${() => setOpenS(false)} aria-labelledby="pvh">
        <div class="sheet-in">
          <div class="sheet-h"><h2 id="pvh" class="h2" style="font-size:24px">Preview</h2><button class="btn small" onClick=${() => setOpenS(false)}>Done</button></div>
          <p class="sub2">Runners marked Sample and your location are simulated here, and nothing is saved. On race day the app uses real GPS and real runners.</p>
          <p class="tiny" style="font-weight:700">Jump to</p>
          <div class="opts">${opt(S.demo.scene, 'join', 'Join screen', () => scene('join'))}${opt(S.demo.scene, 'pre', 'Before the start', () => scene('pre'))}${opt(S.demo.scene, 'ready', 'Start is open', () => scene('ready'))}${opt(S.demo.scene, 'live', 'Running to a bar', () => scene('live'))}${opt(S.demo.scene, 'atbar', 'At a bar', () => scene('atbar'))}${opt(S.demo.scene, 'finished', 'Finished', () => scene('finished'))}</div>
          <p class="tiny" style="font-weight:700">Your location</p>
          <div class="opts">${opt(S.demo.loc, 'here', 'At the bar', () => { S.demo.loc = 'here'; emit(); })}${opt(S.demo.loc, 'far', '640 m away', () => { S.demo.loc = 'far'; emit(); })}${opt(S.demo.loc, 'off', 'Location off', () => { S.demo.loc = 'off'; emit(); })}</div>
          <p class="tiny" style="font-weight:700">Signal</p>
          <div class="opts">${opt(S.demo.net, 'on', 'Signal', () => { S.demo.net = 'on'; emit(); flush(); })}${opt(S.demo.net, 'off', 'No signal', () => { S.demo.net = 'off'; emit(); })}</div>
          <button class="btn full" onClick=${() => { setOpenS(false); onOrg(); }}>Open the organizer view</button>
        </div>
      </dialog>`;
  }

  /* ---------------- App ---------------- */
  function App() {
    useStore();
    const [tab, setTab] = useState(location.hash === '#board' ? 'board' : 'race');
    const [org, setOrg] = useState(location.hash === '#organizer' || new URLSearchParams(location.search).has('organizer'));
    useEffect(() => { let lock = null; const req = () => { try { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').then(l => { lock = l; }).catch(() => {}); } catch (e) {} }; req(); document.addEventListener('visibilitychange', req); return () => { document.removeEventListener('visibilitychange', req); try { lock && lock.release(); } catch (e) {} }; }, []);
    if (S.mode === 'loading') return html`<p class="boot">Loading the race…</p>`;
    if (S.mode === 'setup') return html`<div class="page"><h1 class="h2">Setup needed</h1><p>${S.problem}</p></div>`;
    if (S.mode === 'error') return html`<div class="page"><h1 class="h2">Couldn't load</h1><p>${S.problem}</p><button class="btn" onClick=${() => location.reload()}>Reload</button></div>`;
    const header = html`<header class="top"><a class="mark" href="about.html" aria-label="About the race">5K<b>5</b>BARS</a>${S.mode === 'demo' ? html`<${Preview} onOrg=${() => setOrg(true)} />` : null}
      ${S.me ? html`<span class="bibchip" aria-label=${'Bib ' + S.me.bib + ', ' + S.me.name}><span class="num">${S.me.bib}</span><span>${S.me.name}</span></span>` : null}</header>`;
    const toast = html`${S.toast ? html`<div class="toast" role="status">${S.toast}</div>` : html`<div class="toast" role="status" hidden></div>`}${S.celebrate && S.me ? html`<${Celebrate} />` : null}`;
    if (org) return html`<div class="shell" style="padding-bottom:24px">${header}<main><${Organizer} back=${() => { setOrg(false); if (location.hash === '#organizer' || location.search) history.replaceState(null, '', location.pathname); }} /></main>${toast}</div>`;
    if (!S.me) return html`<div class="shell" style="padding-bottom:24px">${header}<main><${Join} /></main>${toast}</div>`;
    if (!S.stops.length) return html`<div class="shell" style="padding-bottom:24px">${header}<main><div class="page"><div class="alert" role="alert"><p><b>Couldn't load the race.</b> Check your signal.</p><button class="btn" onClick=${() => S.api.reload()}>Retry</button></div></div></main>${toast}</div>`;
    const offline = queue().length > 0 || (S.mode === 'demo' ? S.demo.net === 'off' : !S.online);
    const practicing = S.practice && S.event.goMs == null;
    return html`<div class="shell">${header}
      ${offline ? html`<p class="banner warn" style="margin:12px 16px 0" role="status">${I.dot}No signal. Taps save on this phone and sync later.</p>` : null}
      ${practicing ? html`<${PracticeBar} />` : null}
      <main>${tab === 'race' ? html`<${Race} />` : tab === 'map' ? html`<${MapScreen} />` : html`<${Board} />`}</main>
      <nav class="tabs" aria-label="Sections">
        <button aria-current=${tab === 'race' ? 'page' : null} onClick=${() => { setTab('race'); window.scrollTo(0, 0); }}>${I.flag}Race</button>
        <button aria-current=${tab === 'map' ? 'page' : null} onClick=${() => { setTab('map'); window.scrollTo(0, 0); }}>${I.map}Map</button>
        <button aria-current=${tab === 'board' ? 'page' : null} onClick=${() => { setTab('board'); window.scrollTo(0, 0); }}>${I.list}Leaderboard</button>
      </nav>${toast}</div>`;
  }

  document.addEventListener('touchstart', () => {}, { passive: true });
  render(html`<${App} />`, root);
  const DEMO = new URLSearchParams(location.search).has('demo');
  S.api = CFG && !DEMO ? CloudApi : DemoApi;
  S.api.init().catch(e => { console.error(e); S.mode = 'error'; S.problem = "Couldn't load the race. Check your signal and reload."; emit(); });
  if (CFG && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
