<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>5K 5 Bars</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Check in at every bar, see your leg paces, and follow the Beer Club × WRTC 5K 5 Bars leaderboard.">
<meta name="theme-color" content="#E9EDF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1628" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="5K 5 Bars">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
/* ============================================================================================
   5K 5 BARS DESIGN RULES (Sep 28, 2026). Read PRODUCT.md, DESIGN.md and STATES.md before any UI change.
   1. Source: a race bib. Navy band, one bib red, amber only for "at the bar". Not In.'s green.
   2. One job per screen. The race screen is the next bar and one big button. Nothing else competes.
      During the race, no stats on the Race tab. Numbers live on the finish screen and behind a tap on the leaderboard.
   3. The big button: full width, >=104px tall, radius 20, bib red, always on the canvas, lower half.
   4. Secondary actions are outlined and >=48px. Nothing tappable is plain text.
   5. Big Shoulders Display for bar names, the button label and big numbers. Instrument Sans for the rest.
      Body 17px; nothing under 14px. tabular-nums on every time, pace, rank and bib.
   6. State is never color alone: "At the bar" says so in words; a check-in without location says so in words.
   7. Never fake a number: untimed legs show a dash and are left out of pace. Samples are labeled.
   8. Your own row is a full-surface tint plus a "You" chip. No colored side borders.
   9. Tokens only (below). 120ms ease-out state changes, press scale .97, no page-load reveals.
  10. Check at 320, 375 and 390 wide, light and dark, with "Independence Beer Garden". No sideways scroll.
   ============================================================================================ */
:root{
  --canvas:#E9EDF3; --surface:#FFFFFF; --surface-2:#F3F5F9; --ink:#0F1A2E; --ink-2:#45506A; --line:#C9D1DE;
  --action:#C41E2A; --action-press:#A5151F; --on-action:#FFFFFF; --focus:#C41E2A;
  --navy:#14244A; --on-navy:#FFFFFF; --on-navy-2:#B9C4DD; --medal:#F0A53A; --medal-ink:#6B4308;
  --map-park:#DCE7E0; --map-bldg:#DDE2EA; --map-road:#FFFFFF; --map-road-major:#FFFFFF; --map-rail:#C9D1DE; --map-label:#5A6580;
  --bar:#A8680E; --bar-soft:#FDEFD6; --bar-ink:#6B4308;
  --ok:#1F7A4D; --warn:#8A5A00; --scrim:rgba(10,18,34,.5); --river:#CFDDEE;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Instrument Sans",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --r-big:20px; --r-card:14px; --r-pill:999px;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#0E1628; --surface:#172238; --surface-2:#1F2C46; --ink:#E6ECF5; --ink-2:#A9B5CB; --line:#34425F;
    --action:#C81E2A; --action-press:#A8161F; --on-action:#FFFFFF; --focus:#FF6B74;
    --navy:#1B2D5A; --on-navy:#FFFFFF; --on-navy-2:#B9C4DD;
    --map-park:#14261F; --map-bldg:#141E34; --map-road:#243250; --map-road-major:#31436A; --map-rail:#26334F; --map-label:#8F9CB6;
    --bar:#F0A53A; --bar-soft:#3A2C12; --bar-ink:#FFD99A;
    --ok:#5FD39A; --warn:#F2C46B; --scrim:rgba(0,0,0,.6); --river:#16304F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#0E1628; --surface:#172238; --surface-2:#1F2C46; --ink:#E6ECF5; --ink-2:#A9B5CB; --line:#34425F;
  --action:#C81E2A; --action-press:#A8161F; --on-action:#FFFFFF; --focus:#FF6B74;
  --navy:#1B2D5A; --on-navy:#FFFFFF; --on-navy-2:#B9C4DD;
  --map-park:#14261F; --map-bldg:#141E34; --map-road:#243250; --map-road-major:#31436A; --map-rail:#26334F; --map-label:#8F9CB6;
  --bar:#F0A53A; --bar-soft:#3A2C12; --bar-ink:#FFD99A;
  --ok:#5FD39A; --warn:#F2C46B; --scrim:rgba(0,0,0,.6); --river:#16304F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--canvas)}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,a,[role="button"]{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-size:max(17px,1rem);color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0;text-wrap:pretty;overflow-wrap:break-word}
.num{font-variant-numeric:tabular-nums}
.boot{padding:40px 16px;color:var(--ink-2)}
[hidden]{display:none!important}

.shell{min-height:100svh;display:flex;flex-direction:column;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.top{background:var(--navy);color:var(--on-navy);padding:max(10px,env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
.mark{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.02em;line-height:1;color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:44px;-webkit-tap-highlight-color:transparent;transition:transform 120ms ease-out}
.mark:active{transform:scale(.94) rotate(-2deg)}
.mark b{color:#FF6B74}
.bibchip{margin-left:auto;display:flex;align-items:center;gap:8px;background:#FFFFFF;color:#0F1A2E;border-radius:8px;padding:4px 10px 4px 8px;font-weight:700;font-size:15px;min-width:0;max-width:60%;overflow:hidden}
.bibchip span:first-child{flex:none}
.top .mark,.top .prev-btn{flex:none}
.bibchip span:first-child{font-family:var(--f-display);font-weight:900;font-size:20px;color:#C41E2A;line-height:1}
.bibchip span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.prev-btn{border:1.5px solid var(--on-navy-2);background:transparent;color:var(--on-navy);border-radius:var(--r-pill);min-height:36px;padding:0 12px;font-size:14px;font-weight:600}
.page{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:560px;width:100%;margin:0 auto}

/* route strip */
/* start shoe, a pint per bar, finish medal; the runs are the lines. Outline = ahead, filled = done (inverted), red = running there now */
.strip{display:flex;align-items:center;gap:0;padding:6px 2px 0}
.node{flex:0 0 auto;width:36px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink-2);color:var(--ink-2);background:var(--canvas)}
.node svg{width:64%;height:64%;display:block}
.node.done{background:var(--ink);border-color:var(--ink);color:var(--canvas)}
.node.now{border:3px solid var(--action);color:var(--action);background:var(--surface);transform:scale(1.14)}
.node.here{background:var(--bar);border-color:var(--bar);color:#1A1204;transform:scale(1.14)}
.seg{flex:1 1 auto;height:3px;background:var(--line);min-width:8px}
.seg.done{background:var(--ink)}
.seg.run{background:var(--action)}
@media (prefers-reduced-motion:no-preference){.node{transition:background-color 120ms ease-out,transform 120ms ease-out}}
.strip-cap{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);margin-top:6px}
.stripbtn{display:block;width:100%;background:none;border:0;padding:6px 0 4px;margin:-6px 0 -4px;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:14px;-webkit-tap-highlight-color:transparent}
.stripbtn:active{transform:scale(.99)}
.strip-more{color:var(--ink);font-weight:700}

/* next bar */
.where{display:flex;flex-direction:column;gap:6px}
.where .step{font-size:15px;font-weight:600;color:var(--ink-2)}
.barname{font-family:var(--f-display);font-weight:900;font-size:clamp(38px,11vw,52px);line-height:.95;text-transform:uppercase;letter-spacing:.005em}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:16px;color:var(--ink-2)}
.meta b{color:var(--ink);font-weight:700}
.atpanel{background:var(--bar-soft);color:var(--bar-ink);border-radius:var(--r-card);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.atpanel .lbl{font-weight:700;font-size:15px}
.atpanel .bigt{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:1}
.atpanel .sub{font-size:15px}
.atpanel .count{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:.95;letter-spacing:.01em}

/* buttons */
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:112px;border:0;border-radius:var(--r-big);background:var(--action);color:var(--on-action);padding:14px 16px;text-align:center;transition:transform 120ms var(--ease-out),background-color 120ms var(--ease-out)}
.big:active{transform:scale(.97);background:var(--action-press)}
.big[disabled]{cursor:default}
.btn[disabled]{opacity:.55;cursor:default}
.big .l1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,9vw,40px);line-height:1;text-transform:uppercase}
.big .l2{font-size:15px;font-weight:600;opacity:.92}
.big.saved{background:var(--ok);color:#FFFFFF}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.big:active{transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:12px;border:2px solid var(--ink-2);background:transparent;color:var(--ink);font-weight:700;font-size:16px;text-decoration:none;transition:transform 120ms var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn.full{width:100%}
.btn.red{border-color:var(--action);color:var(--action)}
.btn.small{min-height:44px;font-size:15px;padding:0 14px;white-space:nowrap}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--canvas)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

/* status + splits */
.status{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}
.ico{width:18px;height:18px;flex:0 0 auto}
.card{background:var(--surface);border-radius:var(--r-card);padding:14px 16px}
.alert{background:var(--surface);border:2px solid var(--ink-2);border-radius:var(--r-card);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.alert p b{font-weight:700}
.split{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.split .k{font-size:15px;color:var(--ink-2);font-weight:600}
.split .v{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1}
.split .u{font-size:15px;color:var(--ink-2)}
.timer{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1}
.legs{width:100%;border-collapse:collapse;font-size:16px}
.legs th{font-size:14px;color:var(--ink-2);font-weight:600;text-align:left;padding:0 0 6px}
.legs td{padding:8px 0;border-top:1px solid var(--line)}
.legs td.r,.legs th.r{text-align:right;white-space:nowrap;padding-left:12px}
.sched{display:flex;flex-direction:column}
.sched div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.sched div:first-child{border-top:0}
.sched span:last-child{color:var(--ink-2);white-space:nowrap}
.sched .cur{font-weight:700}
.h2{font-family:var(--f-display);font-weight:900;font-size:28px;line-height:1;text-transform:uppercase}
.sub2{font-size:15px;color:var(--ink-2)}

/* finish */
.finbib{background:#FFFFFF;color:#0F1A2E;border-radius:var(--r-card);overflow:hidden}
.finbib .band{background:#14244A;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.finbib .mid{padding:14px 16px 16px;text-align:center}
.finbib .word{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:.9;color:#C41E2A}
.finbib .who{font-weight:700;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:#F3F5F9;border-radius:10px;padding:10px 6px}
.stats b{display:block;font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1}
.stats span{font-size:13.5px;color:#45506A;font-weight:600}

/* leaderboard */
.lbhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lb{background:var(--surface);border-radius:var(--r-card);overflow:hidden}
.lbitem{border-top:1px solid var(--line)}
.lbitem:first-child{border-top:0}
.lbitem.me{background:var(--surface-2)}
.lbrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;width:100%;min-height:64px;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color 120ms ease-out}
.lbrow:active{background:var(--surface-2)}
.lbrow .who,.lbrow .n,.lbrow .pos{display:flex}
.lbrow .who{flex-direction:column;min-width:0}
.lbrow .pace b,.lbrow .pace span{display:block}
.lbmore{padding:2px 14px 14px}
.night{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden;background:var(--canvas)}
.night span{flex-basis:0;min-width:3px}
.nb-run{background:var(--action)}
.nb-bar{background:var(--bar)}
.nb-gap{background:var(--line)}
.nkey{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:15px;color:var(--ink-2)}
.nkey span{display:inline-flex;align-items:center;gap:6px}
.nkey b{color:var(--ink)}
.nkey i{display:inline-block;width:12px;height:12px;border-radius:3px}
.hi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:12px 0 4px}
.hi div{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--ink-2);font-weight:600}
.hi b{font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1;color:var(--ink)}
.legs tr.atrow td{color:var(--ink-2)}
.rank{font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1;text-align:center}
.who .n{font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.who .bibn{font-family:var(--f-display);font-weight:900;color:var(--action);font-size:19px}
.who .pos{font-size:14.5px;color:var(--ink-2)}
.pace{text-align:right}
.pace b{display:block;font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1}
.pace span{font-size:14px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;border-radius:var(--r-pill);padding:1px 8px;font-size:13px;font-weight:700;border:1.5px solid var(--ink-2);color:var(--ink-2)}
.chip.you{border-color:var(--ink);color:var(--ink)}

/* join */
.join{padding:24px 16px;display:flex;flex-direction:column;gap:18px;max-width:480px;margin:0 auto;width:100%}
.hero{background:#FFFFFF;color:#0F1A2E;border-radius:var(--r-card);overflow:hidden}
.hero .band{background:#14244A;color:#fff;padding:10px 16px;font-weight:700;font-size:15px}
.hero .mid{padding:10px 16px 16px;text-align:center}
.hero .word{font-family:var(--f-display);font-weight:900;font-size:clamp(64px,22vw,110px);line-height:.9;color:#C41E2A}
.hero .sub{font-family:var(--f-display);font-weight:900;font-size:24px;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:16px}
.field input{min-height:56px;border-radius:12px;border:2px solid var(--ink-2);background:var(--surface);padding:0 14px}
.field input.bibin{font-family:var(--f-display);font-weight:900;font-size:36px;letter-spacing:.04em}
.err{color:var(--action);font-weight:600;font-size:15px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#FF8A91}}
:root[data-theme="dark"] .err{color:#FF8A91}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px 8px max(8px,env(safe-area-inset-bottom,0px));z-index:10}
.tabs button{min-height:52px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:14px;color:var(--ink-2)}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.tabs svg{width:22px;height:22px}

/* sheet + toast */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:90svh;border-radius:20px 20px 0 0;background:var(--surface);color:var(--ink);overflow-y:auto;overscroll-behavior:contain}
dialog.sheet::backdrop{background:var(--scrim)}
.sheet-in{padding:18px 16px max(20px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;border-radius:var(--r-pill);border:2px solid var(--ink-2);background:transparent;padding:0 14px;font-weight:600;font-size:15px}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--canvas)}
/* finish moment */
.cele{position:fixed;inset:0;z-index:60;background:var(--navy);display:grid;place-items:center;padding:16px;animation:cele-in 160ms ease-out both;cursor:pointer}
.cele.out{animation:cele-out 260ms ease-in forwards}
.cele canvas{position:absolute;inset:0;width:100%;height:100%}
.cele-in{position:relative;text-align:center;color:var(--on-navy);display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:-6svh}
.cele-medal{color:var(--on-navy)}
.cele-medal svg{width:124px;height:auto;display:block;animation:medal-pop 560ms cubic-bezier(.2,1.5,.4,1) both}
.cele-word{font-family:var(--f-display);font-weight:900;font-size:76px;line-height:.9;text-transform:uppercase;animation:rise 320ms 160ms ease-out both}
.cele-sub{font-weight:700;font-size:20px;color:var(--medal);animation:rise 320ms 260ms ease-out both}
@keyframes cele-in{from{opacity:0}}
@keyframes cele-out{to{opacity:0}}
@keyframes medal-pop{from{transform:scale(.2) rotate(-18deg);opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
@media (prefers-reduced-motion:reduce){.cele,.cele *,.cele.out{animation:none!important}}
.medalbtn{display:block;margin:0 auto 6px;background:none;border:0;padding:4px;min-width:48px;min-height:48px;cursor:pointer;border-radius:12px}
.medalbtn svg{width:58px;height:auto;display:block;color:#14244A}
.medalbtn:active{transform:scale(.97)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--canvas);border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px;max-width:528px;margin:0 auto}
.banner{background:var(--surface);border-radius:12px;padding:10px 14px;font-size:15px;display:flex;gap:8px;align-items:center}
.banner.warn{color:var(--warn)}

/* organizer */
.orgstop{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.orgstop:first-of-type{border-top:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2>*,.row2>*{min-width:0}
.small-in{min-width:0;max-width:100%;min-height:48px;border-radius:10px;border:2px solid var(--ink-2);background:var(--canvas);padding:0 10px;width:100%}
.tiny{font-size:14px;color:var(--ink-2)}
.loccheck{display:flex;flex-direction:column;gap:8px}
.practice{margin:12px 16px 0;padding:8px 8px 8px 14px;border-radius:12px;background:var(--bar-soft);color:var(--bar-ink);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px}
.practice .btn{border-color:var(--bar-ink);color:var(--bar-ink)}
.check{display:flex;align-items:center;gap:12px;min-height:48px;font-size:16px;cursor:pointer}
.check input{width:24px;height:24px;margin:0;accent-color:var(--action);flex:none}
.check span{min-width:0}
/* MapLibre GL 5.7 core styles the app uses (positioning, popups, attribution), inlined */

<body>
<div id="app"><p class="boot">Loading the race…</p></div>
<noscript><p class="boot">This race app needs JavaScript turned on.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js"></script>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var root = document.getElementById('app');
  if (!window.htmPreact) { root.innerHTML = '<p class="boot">The race app could not load. Check your signal and reload.</p>'; return; }
  const { html, render, useState, useEffect, useRef } = window.htmPreact;
  const CFG = window.RACE_CONFIG || null;
  const MI = 1.609344;
  const TZ = 'America/New_York';

  /* ---------------- The route. Organizer can edit names, times and locations. ---------------- */
  const DEFAULT_STOPS = [
    { ord: 0, name: 'Rittenhouse Square', short: 'Rittenhouse', addr: 'Start, 18th & Walnut', lat: 39.9495, lng: -75.1719, radius: 150, km: 0, leaveMin: 0 },
    { ord: 1, name: 'PHS Pop Up Garden', short: 'PHS Garden', addr: '1438 South St', lat: 39.94368, lng: -75.16623, radius: 120, km: 1.14, leaveMin: 45 },
    { ord: 2, name: "McGillin's Olde Ale House", short: "McGillin's", addr: '1310 Drury St', lat: 39.95016, lng: -75.16204, radius: 120, km: 1.0, leaveMin: 85 },
    { ord: 3, name: 'Independence Beer Garden', short: 'Indy Beer Garden', addr: '100 S Independence Mall W', lat: 39.94918, lng: -75.15085, radius: 150, km: 1.01, leaveMin: 125 },
    { ord: 4, name: 'Bar 4', short: 'Bar 4', addr: 'Still being picked', lat: 39.95224, lng: -75.14508, radius: 150, km: 0.85, leaveMin: 165 },
    { ord: 5, name: "Morgan's Pier", short: "Morgan's Pier", addr: '221 N Columbus Blvd', lat: 39.9553, lng: -75.1393, radius: 150, km: 0.85, leaveMin: null },
  ];

  /* ---------------- Store ---------------- */
  const S = {
    mode: 'loading', problem: '', me: null, event: { startMs: 0, goMs: null }, stops: [], runners: {}, taps: {},
    online: navigator.onLine !== false, lastSync: 0, loadFailed: false, admin: false, adminEmail: '',
    demo: { loc: 'here', net: 'on', scene: 'live' }, api: null, lastMine: null, toast: '',
  };
  const subs = new Set();
  const emit = () => subs.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  function useStore() { const [, set] = useState(0); useEffect(() => { const f = () => set(x => x + 1); subs.add(f); f(); return () => subs.delete(f); }, []); return S; }
  function useTick(ms) { const [, set] = useState(0); useEffect(() => { const id = setInterval(() => set(x => x + 1), ms); return () => clearInterval(id); }, [ms]); }
  const now = () => Date.now();
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
  let toastTimer = null;
  function say(msg) { S.toast = msg; emit(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ''; emit(); }, 3200); }

  /* ---------------- Formatting ---------------- */
  const clock = ms => new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: TZ }).replace(/\s?[AP]M$/, '');
  const clockAP = ms => new Date(ms).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: TZ });
  function dur(sec) { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); }
  const pace = spm => spm == null ? '–' : dur(spm);
  const km = k => (k < 1 ? k.toFixed(2) : k.toFixed(1)) + ' km';
  const meters = m => (m < 1000 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1) + ' km');
  const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
  const mins = ms => { const m = Math.round(ms / 60000); return m <= 0 ? 'now' : m < 60 ? m + ' min' : Math.floor(m / 60) + ' hr ' + (m % 60) + ' min'; };
  function haversine(a, b) { const R = 6371000, t = x => x * Math.PI / 180; const dLat = t(b.lat - a.lat), dLng = t(b.lng - a.lng); const h = Math.sin(dLat / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dLng / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
  /* Directions open the phone's own maps: Apple Maps on iPhone, iPad and Mac; Google Maps on Android and everything else. Walking, to the pin. */
  const APPLE = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) && !/Android/i.test(navigator.userAgent);
  const dirUrl = s => APPLE
    ? 'https://maps.apple.com/?daddr=' + s.lat + ',' + s.lng + '&dirflg=w'
    : 'https://www.google.com/maps/dir/?api=1&destination=' + s.lat + ',' + s.lng + '&travelmode=walking';
  const pinUrl = s => APPLE
    ? 'https://maps.apple.com/?ll=' + s.lat + ',' + s.lng + '&q=' + encodeURIComponent(s.name)
    : 'https://www.google.com/maps/search/?api=1&query=' + s.lat + ',' + s.lng;
  const MAPS = APPLE ? 'Apple Maps' : 'Google Maps';
  const appleDir = s => 'https://maps.apple.com/?daddr=' + s.lat + ',' + s.lng + '&dirflg=w';
  const googleDir = s => 'https://www.google.com/maps/dir/?api=1&destination=' + s.lat + ',' + s.lng + '&travelmode=walking';
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  /* ---------------- Philly street grid (from In.): miles from 15th & Market, x east, y north, ~9.3 deg off true north ---------------- */
  const GRID = { lat0: 39.95253, lng0: -75.16531, kx: 53.03, ky: 69.05, c: Math.cos(9.3 * Math.PI / 180), s: Math.sin(9.3 * Math.PI / 180) };
  function gridOf(lat, lng) { const e = (lng - GRID.lng0) * GRID.kx, n = (lat - GRID.lat0) * GRID.ky; return { x: e * GRID.c - n * GRID.s, y: e * GRID.s + n * GRID.c }; }
  function latLngOf(p) { const e = p.x * GRID.c + p.y * GRID.s, n = p.y * GRID.c - p.x * GRID.s; return { lat: GRID.lat0 + n / GRID.ky, lng: GRID.lng0 + e / GRID.kx }; }
  // Walking distance on the grid counts blocks both ways.
  function legKm(a, b) { const A = gridOf(a.lat, a.lng), B = gridOf(b.lat, b.lng); return Math.round((Math.abs(A.x - B.x) + Math.abs(A.y - B.y)) * MI * 100) / 100; }

  /* ---------------- Philadelphia time for the organizer's inputs ---------------- */
  function nyOffset(ms) { const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(new Date(ms)).map(x => [x.type, x.value])); return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000; }
  function fromNY(date, time) { const [y, mo, d] = date.split('-').map(Number), [h, mi] = time.split(':').map(Number); const g = Date.UTC(y, mo - 1, d, h, mi); return g - nyOffset(g); }
  const nyDate = ms => new Date(ms).toLocaleDateString('en-CA', { timeZone: TZ });
  const nyTime = ms => new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: TZ });

  /* ---------------- Race math: moving pace only ---------------- */
  const lastOrd = () => S.stops.length - 1;
  const PKEY = 'race-practice-v1';
  S.practice = lsGet(PKEY) === '1';
  const started = () => S.practice || S.event.goMs != null || (S.event.startMs && now() >= S.event.startMs);
  /* Practice runs are for the days before the race: offered only while the start is more than 6 hours away. */
  const practiceAllowed = () => S.event.goMs == null && S.event.startMs && S.event.startMs - now() > 6 * 3600000;
  function setPractice(on) { S.practice = !!on; lsSet(PKEY, on ? '1' : ''); emit(); }
  function tapsOf(rid) { const t = now(); return Object.values(S.taps).filter(x => x.runnerId === rid && x.at <= t); }
  function progress(rid) {
    const arr = {}, lv = {};
    tapsOf(rid).forEach(t => { (t.kind === 'arrive' ? arr : lv)[t.stop] = t; });
    const n = lastOrd(), legs = [];
    for (let i = 1; i <= n; i++) {
      const fromAt = lv[i - 1] ? lv[i - 1].at : null;  /* leg 1 counts from this runner's own Start tap */
      const to = arr[i], k = S.stops[i] ? S.stops[i].km : 0;
      const sec = fromAt != null && to && to.at > fromAt ? (to.at - fromAt) / 1000 : null;
      legs.push({ i, km: k, sec, pace: sec && k ? sec / (k / MI) : null, arrive: to || null, leave: lv[i] || null });
    }
    let reached = 0;
    for (let i = 1; i <= n; i++) if (arr[i]) reached = i;
    const timed = legs.filter(l => l.sec && l.km);
    const secSum = timed.reduce((a, l) => a + l.sec, 0), miSum = timed.reduce((a, l) => a + l.km / MI, 0);
    let state, target;
    if (reached === n && n > 0) state = 'finished';
    else if (reached === 0 && lv[0]) { state = 'enroute'; target = 1; }
    else if (reached === 0) { state = started() ? 'ready' : 'pre'; target = 0; }
    else if (!lv[reached]) { state = 'atbar'; target = reached; }
    else { state = 'enroute'; target = reached + 1; }
    const unverified = Object.values(arr).filter(t => !t.verified).length;
    return { legs, reached, timed: timed.length, avg: timed.length ? secSum / miSum : null, moving: secSum, state, target, arr, lv, unverified };
  }
  function board() {
    const rows = Object.values(S.runners).filter(r => !r.hidden || (S.me && r.id === S.me.id)).map(r => ({ r, p: progress(r.id) }));
    rows.sort((a, b) => (a.p.avg == null) - (b.p.avg == null) || (a.p.avg || 0) - (b.p.avg || 0) || b.p.timed - a.p.timed || a.r.bib - b.r.bib);
    let rank = 0; rows.forEach(x => { x.rank = x.p.avg == null ? null : ++rank; });
    return rows;
  }
  /* The night as segments: running (leave to next arrive), at a bar (arrive to leave), or unknown (a missed tap). For after the race. */
  function night(p) {
    const n = lastOrd(), pts = [];
    for (let i = 0; i <= n; i++) { if (i && p.arr[i]) pts.push({ t: p.arr[i].at, k: 'arrive', i }); if (p.lv[i]) pts.push({ t: p.lv[i].at, k: 'leave', i }); }
    pts.sort((a, b) => a.t - b.t);
    const segs = [];
    for (let j = 1; j < pts.length; j++) {
      const a = pts[j - 1], b = pts[j], sec = (b.t - a.t) / 1000;
      if (sec <= 0) continue;
      const kind = a.k === 'leave' && b.k === 'arrive' ? 'run' : a.k === 'arrive' && b.k === 'leave' && a.i === b.i ? 'bar' : 'gap';
      segs.push({ kind, sec, i: b.i });
    }
    const bars = [];
    for (let i = 1; i < n; i++) if (p.arr[i] && p.lv[i] && p.lv[i].at > p.arr[i].at) bars.push({ i, sec: (p.lv[i].at - p.arr[i].at) / 1000 });
    return { segs, bars, barSec: bars.reduce((a, b) => a + b.sec, 0), total: segs.reduce((a, s) => a + s.sec, 0) };
  }
  const stay = sec => sec < 60 ? 'under 1 min' : mins(sec * 1000);
  function myLastTap() { if (!S.me) return null; const mine = Object.values(S.taps).filter(t => t.runnerId === S.me.id); mine.sort((a, b) => b.created - a.created); return mine[0] || null; }

  /* ---------------- Location: read only on a tap; keep only the distance ---------------- */
  function locate() {
    if (S.mode === 'demo') {
      return new Promise(res => setTimeout(() => {
        if (S.demo.loc === 'off') res({ error: 'denied' });
        else res({ sim: S.demo.loc, acc: 25 });
      }, 700));
    }
    return new Promise(res => {
      if (!navigator.geolocation) { res({ error: 'unavailable' }); return; }
      navigator.geolocation.getCurrentPosition(
        p => res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }),
        e => res({ error: e && e.code === 1 ? 'denied' : 'unavailable' }),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 15000 });
    });
  }
  function judge(fix, stop) {
    if (fix.error) return { ok: false, reason: fix.error };
    const dist = fix.sim ? (fix.sim === 'far' ? 640 : 30) : haversine(fix, stop);
    const acc = Math.round(fix.acc || 0);
    const ok = dist - Math.min(acc, 150) <= stop.radius;
    return { ok, reason: ok ? '' : 'far', dist: Math.round(dist), acc };
  }

  /* ---------------- Offline queue: taps keep their real time and sync later ---------------- */
  const QKEY = 'race-queue-v1';
  function queue() { try { return JSON.parse(lsGet(QKEY) || '[]'); } catch (e) { return []; } }
  function saveQueue(q) { lsSet(QKEY, JSON.stringify(q)); }
  let flushing = false;
  async function flush() {
    if (flushing || !S.api) return; flushing = true;
    try {
      let q = queue();
      for (const t of q.slice()) {
        try {
          const saved = await S.api.addTap(t);
          if (saved) Object.assign(S.taps[t.id] || (S.taps[t.id] = t), saved, { pending: false });
          q = q.filter(x => x.id !== t.id); saveQueue(q); S.online = true;
        } catch (e) {
          if (e && e.code === 'dup') { q = q.filter(x => x.id !== t.id); saveQueue(q); delete S.taps[t.id]; await S.api.reload(); }
          else if (e && e.code === 'rejected') { q = q.filter(x => x.id !== t.id); saveQueue(q); delete S.taps[t.id]; say(e.message || "That tap wasn't accepted."); }
          else { S.online = false; break; }
        }
      }
    } finally { flushing = false; emit(); }
  }
  async function tap(stop, kind, v) {
    const t = { id: uuid(), runnerId: S.me.id, stop, kind, at: now(), created: now(), verified: !!v.verified, distM: v.dist != null ? v.dist : null, accM: v.acc != null ? v.acc : null, source: v.source, pending: true };
    S.taps[t.id] = t; S.lastMine = t.id; emit();
    const q = queue(); q.push(t); saveQueue(q);
    await flush();
    return t;
  }
  async function undo(t) {
    const q = queue().filter(x => x.id !== t.id);
    const wasQueued = q.length !== queue().length; saveQueue(q);
    delete S.taps[t.id]; emit();
    if (!wasQueued) { try { await S.api.undoTap(t.id); } catch (e) { S.taps[t.id] = t; emit(); say("Couldn't undo. Check your signal and try again."); return; } }
    say('Undone.');
  }

  /* ---------------- Demo: a preview with simulated runners and location ---------------- */
  const SAMPLES = [
    ['Priya', 7, 440, [9, 8, 7, 8]], ['Dev', 12, 455, [10, 9, 9, 6]], ['Maya', 18, 470, [12, 10, 11, 9]], ['Tomás', 31, 500, [8, 12, 8, 10]],
    ['Aisha', 44, 515, [15, 14, 13, 12]], ['Leo', 52, 530, [11, 9, 14, 10]], ['Hannah', 67, 560, [16, 13, 12, 11]], ['Sam', 88, 590, [14, 15, 12, 13]],
    ['Inés', 95, 610, [13, 12, 16, 10]], ['Marcus', 101, 650, [18, 16, 15, 14]], ['Kelly', 135, 700, [17, 15, 14, 12]], ['Chris', 142, 900, [12, 11, 10, 9]],
    ['Grace', 160, 1150, [9, 9, 8, 7]], ['Ben', 1188, 1200, [8, 8, 7, 6]],
  ];
  function demoStops(startMs) { return DEFAULT_STOPS.map(s => Object.assign({}, s, { leaveBy: s.leaveMin == null ? null : startMs + s.leaveMin * 60000 })); }
  function demoTimeline(go, paceSec, dwell, opts) {
    const stops = S.stops; let t = go + (opts.delay || 0) * 60000;
    if (t > now()) return [];
    const out = [{ stop: 0, kind: 'leave', at: t, verified: true }];
    for (let i = 1; i < stops.length; i++) {
      const arrive = t + stops[i].km / MI * paceSec * 1000;
      if (arrive > now()) break;
      out.push({ stop: i, kind: 'arrive', at: arrive, verified: !(opts.unverified === i) });
      if (i < stops.length - 1) {
        const leave = Math.min(stops[i].leaveBy, arrive + dwell[i - 1] * 60000);
        const lv = Math.max(leave, arrive + 60000);
        if (lv > now()) break;
        if (opts.forget !== i) out.push({ stop: i, kind: 'leave', at: lv, verified: true });
        t = lv;
      }
    }
    return out;
  }
  function demoScene(scene) {
    const n = now();
    S.demo.scene = scene;
    S.celebrate = scene === 'finished';
    const go = scene === 'pre' || scene === 'join' ? null : n - (scene === 'finished' ? 170 : scene === 'atbar' ? 55 : scene === 'ready' ? 3 : 48) * 60000;
    const startMs = go != null ? go : n + 12 * 60000;
    S.event = { startMs, goMs: go, name: 'Beer Club × WRTC 5K 5 Bars' };
    S.stops = demoStops(startMs);
    S.runners = {}; S.taps = {};
    SAMPLES.forEach(([name, bib, p, dwell], idx) => {

      const delay = idx === 12 ? 14 : (idx % 4) * 1.5;
      demoTimeline(go, p, dwell, { delay, forget: idx === 5 ? 2 : null, unverified: idx === 3 ? 3 : null }).forEach((x, j) => {
        const tid = id + '-' + j; S.taps[tid] = Object.assign({ id: tid, runnerId: id, created: x.at, source: 'gps' }, x);
      });
    });
    if (scene === 'join') { S.me = null; emit(); return; }
    S.me = { id: 'me', bib: 23, name: 'Jason' };

    const mine = [];
    if (scene === 'live' || scene === 'atbar' || scene === 'finished') {
      mine.push({ stop: 0, kind: 'leave', at: go + 0.4 * 60000 }, { stop: 1, kind: 'arrive', at: go + 6.7 * 60000 }, { stop: 1, kind: 'leave', at: go + 41 * 60000 });
    }
    if (scene === 'atbar') mine.push({ stop: 2, kind: 'arrive', at: go + 47.2 * 60000 });
    if (scene === 'finished') {
      mine.push({ stop: 2, kind: 'arrive', at: go + 46.6 * 60000 }, { stop: 2, kind: 'leave', at: go + 82 * 60000 },
        { stop: 3, kind: 'arrive', at: go + 87.4 * 60000 }, { stop: 3, kind: 'leave', at: go + 121 * 60000 },
        { stop: 4, kind: 'arrive', at: go + 125.6 * 60000 }, { stop: 4, kind: 'leave', at: go + 160 * 60000 },
        { stop: 5, kind: 'arrive', at: go + 164.4 * 60000 });
    }
    mine.forEach((x, j) => { const tid = 'me-' + j; S.taps[tid] = Object.assign({ id: tid, runnerId: 'me', created: x.at - 1, verified: true, source: 'gps' }, x); });
    emit();
  }
  const DemoApi = {

    },

    async addTap(t) {
      if (S.demo.net === 'off') { const e = new Error('offline'); throw e; }
      await new Promise(r => setTimeout(r, 250));
      const dup = Object.values(S.taps).find(x => x.runnerId === t.runnerId && x.stop === t.stop && x.kind === t.kind && x.id !== t.id && !x.pending);
      if (dup) { const e = new Error('dup'); e.code = 'dup'; throw e; }
      return {};
    },

    async setGo(ms) { S.event.goMs = ms; if (ms != null) { S.event.startMs = ms; S.stops = demoStops(ms); } emit(); },

  /* ---------------- Cloud: Supabase (config.js). Anonymous sign-in for runners, email code for organizers. ---------------- */
  function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
  const fromTap = r => ({ id: r.id, runnerId: r.runner_id, stop: r.stop, kind: r.kind, at: Date.parse(r.at), created: Date.parse(r.created_at), verified: r.verified, distM: r.dist_m, accM: r.acc_m, source: r.source, pending: false });
  const fromStop = r => ({ ord: r.ord, name: r.name, short: r.short || r.name, addr: r.addr || '', lat: r.lat, lng: r.lng, radius: r.radius_m, km: Number(r.km) || 0, leaveBy: r.leave_by ? Date.parse(r.leave_by) : null });
  function cloudErr(e) { const m = (e && e.message) || String(e || ''); const err = new Error(m); if (/already tapped/i.test(m)) err.code = 'dup'; else if (/taken|is already/i.test(m)) err.code = 'taken'; else if (/P0001|taken|range|not allowed|no runner|closed/i.test((e && e.code) + ' ' + m)) err.code = 'rejected'; return err; }
  const CloudApi = {
    sb: null,
    problem() {
      const c = CFG || {};
      if (!c.supabaseUrl || !/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(c.supabaseUrl)) return 'config.js needs the Supabase project URL.';
      if (!c.supabaseKey || /^sb_secret_/.test(c.supabaseKey) || /service_role/.test(c.supabaseKey)) return 'config.js needs the publishable key, never a secret key.';
      return '';
    },
    async init() {
      const p = this.problem(); if (p) { S.mode = 'setup'; S.problem = p; emit(); return; }
      try { await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js'); }
      catch (e) { S.mode = 'error'; S.problem = "Couldn't load. Check your signal and reload."; emit(); return; }
      this.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
      S.mode = 'cloud';
      /* a phone that hasn't joined can't read the race yet (every read needs a sign-in), so it goes straight to Join */
      const { data } = await this.sb.auth.getSession();
      this.signedIn = !!(data && data.session);
      if (this.signedIn) { await this.reload(); await this.loadMe(); } else await this.loadPublic();
      this.live();
      setInterval(() => { if (this.signedIn && document.visibilityState === 'visible') this.reload(); }, 20000);
      document.addEventListener('visibilitychange', () => { if (this.signedIn && document.visibilityState === 'visible') { this.reload(); flush(); } });
      window.addEventListener('online', () => { S.online = true; flush(); emit(); });
      window.addEventListener('offline', () => { S.online = false; emit(); });
      flush();
    },
    async loadMe() {
      const { data } = await this.sb.rpc('my_runner');
      const r = Array.isArray(data) ? data[0] : data;
      S.me = r && r.id ? { id: r.id, bib: r.bib, name: r.name, hidden: !!r.hidden } : null;
      const { data: adm } = await this.sb.rpc('is_admin');
      S.admin = !!adm; emit();
    },
    async reload() {
      try {
        const [ev, st, ru, ta] = await Promise.all([
          this.sb.from('event').select('*').eq('id', 1).maybeSingle(),
          this.sb.from('stops').select('*').order('ord'),
          this.sb.from('runners').select('id,bib,name,hidden'),
          this.sb.from('taps').select('id,runner_id,stop,kind,at,verified,source,created_at'),
        ]);
        if (ev.error || st.error || ru.error || ta.error) throw (ev.error || st.error || ru.error || ta.error);
        S.event = { startMs: ev.data && ev.data.start_at ? Date.parse(ev.data.start_at) : 0, goMs: ev.data && ev.data.go_at ? Date.parse(ev.data.go_at) : null, name: (ev.data && ev.data.name) || '5K 5 Bars' };
        S.stops = (st.data || []).map(fromStop);
        S.runners = {}; (ru.data || []).forEach(r => { S.runners[r.id] = r; });
        const pend = Object.values(S.taps).filter(t => t.pending);
        S.taps = {}; (ta.data || []).forEach(r => { S.taps[r.id] = fromTap(r); });
        pend.forEach(t => { if (!S.taps[t.id]) S.taps[t.id] = t; });
        S.lastSync = now(); S.loadFailed = false; S.online = true;
      } catch (e) { console.warn('reload', e); S.loadFailed = true; }
      emit();
    },
    async loadPublic() {
      try {
        const [ev, st] = await Promise.all([this.sb.from('event').select('start_at,go_at,name').eq('id', 1).maybeSingle(), this.sb.from('stops').select('*').order('ord')]);
        if (ev.data) S.event = { startMs: Date.parse(ev.data.start_at), goMs: ev.data.go_at ? Date.parse(ev.data.go_at) : null, name: ev.data.name };
        if (st.data) S.stops = st.data.map(fromStop);
      } catch (e) { console.warn('public', e); }
      emit();
    },
    live() {
      const ch = this.sb.channel('race');
      ch.on('postgres_changes', { event: '*', schema: 'public', table: 'taps' }, p => {
        if (p.eventType === 'DELETE') delete S.taps[p.old.id]; else S.taps[p.new.id] = fromTap(p.new);
        S.lastSync = now(); emit();
      });
      /* bursts of changes (a rename, a course save) refetch once, not once per row */
      ['runners', 'event', 'stops'].forEach(t => ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => { clearTimeout(this.rt); this.rt = setTimeout(() => this.reload(), 1500); }));
      ch.subscribe();
      this.channel = ch;
    },
    async join(bib, name, show) {
      const { data: s } = await this.sb.auth.getSession();
      if (!s || !s.session) { const { error } = await this.sb.auth.signInAnonymously(); if (error) throw cloudErr(error); }
      const { data, error } = await this.sb.rpc('claim_bib', { p_bib: bib, p_name: name });
      if (error) throw cloudErr(error);
      const r = Array.isArray(data) ? data[0] : data;
      /* a first-time phone couldn't read the race before it signed in: load it now, and join live updates as this phone */
      this.signedIn = true;
      await this.reload();
      if (this.channel) { this.sb.removeChannel(this.channel); this.channel = null; }
      this.live();
      if (show === false) await this.sb.rpc('set_show', { p_show: false });
      S.me = { id: r.id, bib: r.bib, name: r.name, hidden: show === false }; S.runners[r.id] = Object.assign({}, S.me); emit();
    },
    async setShow(v) { const { error } = await this.sb.rpc('set_show', { p_show: !!v }); if (error) throw cloudErr(error); S.me.hidden = !v; await this.reload(); },
    async addTap(t) {
      const { data, error } = await this.sb.rpc('add_tap', { p_id: t.id, p_stop: t.stop, p_kind: t.kind, p_at: new Date(t.at).toISOString(), p_verified: t.verified, p_dist: t.distM, p_acc: t.accM, p_source: t.source });
      if (error) { if (/Failed to fetch|NetworkError|network/i.test(error.message || '')) throw new Error('offline'); throw cloudErr(error); }
      const r = Array.isArray(data) ? data[0] : data; return r ? fromTap(r) : {};
    },
    async undoTap(id) { const { error } = await this.sb.rpc('undo_tap', { p_id: id }); if (error) throw cloudErr(error); },
    async setGo(ms) { const { error } = await this.sb.rpc('set_go', { p_at: ms == null ? null : new Date(ms).toISOString() }); if (error) throw cloudErr(error); await this.reload(); },
    async saveStop(ord, f) {
      const row = {}; if (f.name != null) row.name = f.name; if (f.short != null) row.short = f.short; if (f.lat != null) { row.lat = f.lat; row.lng = f.lng; } if (f.radius != null) row.radius_m = f.radius; if (f.leaveBy !== undefined) row.leave_by = f.leaveBy == null ? null : new Date(f.leaveBy).toISOString();
      const { error } = await this.sb.from('stops').update(row).eq('ord', ord); if (error) throw cloudErr(error); await this.reload();
    },
    async saveRoute(stops) {
      const rows = stops.map(x => ({ ord: x.ord, name: x.name, short: x.short, addr: x.addr || '', lat: x.lat, lng: x.lng, radius_m: x.radius, km: x.km, leave_by: x.leaveBy ? new Date(x.leaveBy).toISOString() : null }));
      S.stops = stops; emit();
      const { error } = await this.sb.rpc('admin_save_route', { p_stops: rows }); if (error) { await this.reload(); throw cloudErr(error); } await this.reload();
    },
    async saveEvent(f) { const { error } = await this.sb.rpc('admin_save_event', { p_start: new Date(f.startMs).toISOString() }); if (error) throw cloudErr(error); },
    async deleteTap(id) { const { error } = await this.sb.rpc('admin_delete_tap', { p_id: id }); if (error) throw cloudErr(error); await this.reload(); },
    async clearTaps() { const { error } = await this.sb.rpc('admin_clear_taps'); if (error) throw cloudErr(error); await this.reload(); },
    async clearMine() { saveQueue(queue().filter(t => t.runnerId !== S.me.id)); const { error } = await this.sb.rpc('clear_my_practice'); if (error) throw cloudErr(error); S.lastMine = null; await this.reload(); },
    async removeRunner(id) { const { error } = await this.sb.rpc('admin_remove_runner', { p_id: id }); if (error) throw cloudErr(error); await this.reload(); },
    /* the email carries a sign-in link (Supabase's built-in email) and, once custom SMTP is set up, a code too */
    async sendCode(email) { const { error } = await this.sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname + '?organizer' } }); if (error) throw cloudErr(error); },
    async verifyCode(email, token) {
      const prev = S.me;
      const { error } = await this.sb.auth.verifyOtp({ email, token, type: 'email' }); if (error) throw cloudErr(error);

      this.signedIn = true;
      await this.reload();
      if (this.channel) { this.sb.removeChannel(this.channel); this.channel = null; }
      this.live();
      await this.loadMe(); if (!S.admin) throw new Error('That email is not an organizer.');
    },
    async unlockRunner(id) { const { error } = await this.sb.rpc('admin_unlock_runner', { p_id: id }); if (error) throw cloudErr(error); },
  };

  };

  /* ---------------- Pieces ---------------- */
  /* Six icons: the start (shoe), each bar (pint), the finish (medal). The runs are the lines between them. */
  function Strip({ p, onOpen }) {
    const n = lastOrd(), items = [];

      const name = S.stops[i] ? S.stops[i].short : '';

      const done = i === 0 ? !!p.lv[0] || p.reached > 0 : i === n ? !!p.arr[n] : !!p.lv[i] || p.reached > i;
      const here = (p.state === 'atbar' || p.state === 'ready') && p.target === i;

  function Schedule({ p }) {

  function UndoLast() {

    return html`<button class="btn small" onClick=${() => undo(t)}>Undo “${what}”</button>`;
  }

  /* ---------------- The big button with its location check ---------------- */
  function CheckIn({ stop, p }) {
    const [phase, setPhase] = useState({ k: 'idle' });

    async function go() {

  }
  function LeaveButton({ stop }) {

    const first = stop === 0;
    return saved
      ? html`<button class="big saved" disabled><span class="l1">Go</span><span class="l2">${first ? 'Started' : 'Left ' + s.short} · ${clock(now())}</span></button>`

  }

  /* ---------------- Screens ---------------- */
  function Race() {
    useTick(1000);

    const last = S.lastMine ? S.taps[S.lastMine] : null;
    const n = lastOrd();
    const [legs, setLegs] = useState(false);
    const open = p.reached || p.lv[0] ? () => setLegs(true) : null;

      return html`<${Finished} p=${p} rank=${mine && mine.rank} count=${count} />`;
    }

      return html`<div class="page">
        <${Strip} p=${p} />
        <div class="where"><p class="step">Start line</p><h1 class="barname">${s0.name}</h1>

          <p class="tiny">Opens the start on this phone only, so you can tap Start, check in at a real bar and see how it works. Practice check-ins are cleared before the race.</p>

    }

        <div class="where"><p class="step">Start line · open</p><h1 class="barname">${s0.name}</h1>

        <${Status} t=${last && last.runnerId === S.me.id ? last : null} />
        <${AlreadyNext} p=${p} />
        <${UndoLast} />
        <${LocationCheck} />
      </div>`;
    }

    const s = S.stops[p.target];
    if (p.state === 'atbar') {
      const leaveBy = s.leaveBy;
      return html`<div class="page">
        <${Strip} p=${p} onOpen=${open} />${sheet}
        <div class="where"><p class="step">At the bar · ${p.target} of ${n}</p><h1 class="barname">${s.name}</h1>
          ${(() => { const l = p.legs.find(x => x.i === p.target); return l && l.pace ? html`<p class="meta"><span>Last leg <b class="num">${pace(l.pace)}/mi</b></span></p>` : null; })()}</div>
        <${Countdown} at=${leaveBy} label="Group leaves in" done="Time to go" doneSub=${leaveBy ? 'The group left at ' + clockAP(leaveBy) : ''} />
        <${LeaveButton} stop=${p.target} />

        <${AlreadyNext} p=${p} />
        <${UndoLast} />
      </div>`;
    }

    return html`<div class="page">
      <${Strip} p=${p} onOpen=${open} />${sheet}
      <div class="where"><p class="step">Next · ${p.target === n ? 'the finish' : 'bar ' + p.target + ' of ' + n}</p><h1 class="barname">${s.name}</h1>
        <p class="meta"><span><b class="num">${km(s.km)}</b> from ${S.stops[p.target - 1].short}</span></p></div>
      <${CheckIn} stop=${p.target} p=${p} />
      <${Status} t=${last && last.runnerId === S.me.id ? last : null} />
      <div class="row2"><a class="btn" href=${dirUrl(s)} target="_blank" rel="noopener" aria-label=${'Walking directions to ' + s.short + ' in ' + MAPS}>${I.pin}Directions</a><${UndoLast} /></div>
    </div>`;

  /* A ticking countdown to the start or to the group's leave time. Over an hour out it shows the clock time instead. */

    if (left > 3600) return html`<div class="atpanel" style=${style}><span class="lbl">${plain ? 'Starts at' : 'Group leaves at'}</span><span class="bigt num">${clockAP(at)}</span><span class="sub num">${left > 86400 ? new Date(at).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', timeZone: TZ }) : 'in ' + mins(at - now())}</span></div>`;

  }
  /* "Test my location": a website can't keep location on in the background (and this one doesn't need to: it reads

    }, []);

    if (fix && fix.error) msg = html`<div class="alert" role="alert"><p><b>${fix.error === 'denied' ? 'Location is blocked for this site.' : "Couldn't get a reading."}</b> ${fix.error === 'denied' ? HOW_ON() : 'Step outside or near a window and try again.'}</p></div>`;

      const d = S.stops.map((x, i) => ({ i, m: haversine(ll, x) })).sort((a, b) => a.m - b.m);

  function AlreadyNext({ p }) {
    const next = S.stops[p.target + 1];
    const [ask, setAsk] = useState(false);
    if (!next) return null;
    if (!ask) return html`<button class="btn full" onClick=${() => setAsk(true)}>Already at ${next.short}?</button>`;
    return html`<div class="alert"><p><b>Forgot to tap ${p.target === 0 ? 'Start' : 'Leaving'}?</b> Check in at ${next.short} now. Leg ${p.target + 1} won't be timed, and the rest of your legs still count.</p>

  }
  /* One bar for the whole night: red = running, amber = at a bar, grey = a missed tap. */
  function NightBar({ nt, p }) {
    if (!nt.total) return null;
    return html`<div>
      <div class="night" role="img" aria-label=${'Running ' + (p.timed ? dur(p.moving) : 'not timed') + ', at bars ' + stay(nt.barSec)}>
        ${nt.segs.map(s => html`<span class=${'nb-' + s.kind} style=${'flex-grow:' + Math.round(s.sec)}></span>`)}

    </div>`;
  }
  /* Every run and bar so far (all of them once finished). Nothing ahead is listed, so there are no rows of dashes. */
  function Splits({ p, nt }) {
    const n = lastOrd(), rows = [];
    p.legs.forEach(l => {
      if (l.i > p.reached) return;
      rows.push(html`<tr><td>Run to ${S.stops[l.i].short}</td><td class="r num">${l.sec ? dur(l.sec) : '–'}</td><td class="r num">${l.sec ? pace(l.pace) + '/mi' : 'not timed'}</td></tr>`);

      if (l.i === p.reached && p.state === 'atbar') { rows.push(html`<tr class="atrow"><td>At ${S.stops[l.i].short}</td><td class="r num">${stay((now() - p.arr[l.i].at) / 1000)}</td><td class="r">so far</td></tr>`); return; }

      rows.push(html`<tr class="atrow"><td>At ${S.stops[l.i].short}</td><td class="r num">${b ? stay(b.sec) : '–'}</td><td></td></tr>`);
    });
    if (p.state === 'enroute' && p.target <= n) rows.push(html`<tr class="atrow"><td>Run to ${S.stops[p.target].short}</td><td class="r">now</td><td></td></tr>`);
    return html`<table class="legs"><tbody>${rows}</tbody></table>`;
  }
  /* The tracker: tap the progress strip to see your night so far. */
  function MyLegs({ p, onClose }) {
    const ref = useRef(null);
    useEffect(() => { const d = ref.current; if (d && !d.open) d.showModal(); }, []);
    const nt = night(p), n = lastOrd();
    const rows = board(), mine = rows.find(x => x.r.id === S.me.id), count = rows.filter(x => x.rank).length;
    return html`<dialog class="sheet" ref=${ref} onClose=${onClose} aria-labelledby="mlh">
      <div class="sheet-in">
        <div class="sheet-h"><h2 id="mlh" class="h2" style="font-size:24px">Your legs</h2><button class="btn small" onClick=${() => ref.current.close()}>Done</button></div>
        ${p.timed ? html`<div class="hi">
          <div><span>Average pace</span><b class="num">${pace(p.avg)}/mi</b><span>${p.timed} of ${n} legs timed</span></div>
          <div><span>Place</span><b class="num">${mine && mine.rank ? ordinal(mine.rank) : '–'}</b><span>of ${count} so far</span></div>
        </div>` : null}
        ${nt.total ? html`<${NightBar} nt=${nt} p=${p} />` : null}
        ${p.reached || p.lv[0] ? html`<${Splits} p=${p} nt=${nt} />` : html`<p class="tiny">Nothing yet. Your legs show up here as you check in.</p>`}
      </div></dialog>`;
  }
  /* The finish moment (Jason asked for one): the medal pops, one burst of shoes and pints, about 2 seconds, then the results.

    <path d="M36 0h22l14 52H50z" fill="var(--action)" /><path d="M62 0h22L70 52H48z" fill="currentColor" />
    <circle cx="60" cy="96" r="46" fill="var(--medal)" /><circle cx="60" cy="96" r="36" fill="none" stroke="var(--medal-ink)" stroke-width="3" opacity=".45" />
    <text x="60" y="113" text-anchor="middle" font-family="var(--f-display)" font-weight="900" font-size="50" fill="var(--medal-ink)">5K5</text></svg>`;

      const cs = getComputedStyle(document.documentElement), col = [cs.getPropertyValue('--action').trim(), cs.getPropertyValue('--medal').trim(), '#FFFFFF'];
      const shapes = [SHOE_D.map(d => new Path2D(d)), BEER_D.map(d => new Path2D(d))];
      const ps = Array.from({ length: 28 }, (_, k) => { const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 7;
        return { x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, r: Math.random() * 6.3, vr: (Math.random() - 0.5) * 0.25, s: 0.9 + Math.random() * 0.8, k: k % 2, c: col[k % 3] }; });
